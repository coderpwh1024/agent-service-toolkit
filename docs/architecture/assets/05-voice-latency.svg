<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc"><title id="title">语音延时观测：首字、首包与首声</title><desc id="desc">服务端与手机计时窗口不同。端到端停说至声学首声尚无完整实测，不将配置阈值当作延时。</desc>

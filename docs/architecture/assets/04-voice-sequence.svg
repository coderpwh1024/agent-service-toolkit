<text x="260" y="1469" font-size="20" fill="#72766C" font-weight="400" text-anchor="start">自动能量 VAD：只发 speech_hint；有效 ASR final 被接受后，取消旧回答。</text>
<text x="260" y="1501" font-size="20" fill="#72766C" font-weight="400" text-anchor="start">手点“我要插话”：立即暂停，服务端约 800 ms 恢复 / 客户端 1 s 兜底；显式取消：停播并清缓冲。</text>
<text x="60" y="1550" font-size="17" fill="#72766C" font-weight="400" text-anchor="start">证据：voice/session.py · speech_output.py · Flutter voice_session_controller.dart · Android / iOS 原生音频桥</text>

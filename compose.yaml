services:
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Prefer values inherited by `docker compose` from the host shell. Compose
      # also uses a project .env file for interpolation when one is present.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-}
      APP_TOKEN_TTL_SECONDS: ${APP_TOKEN_TTL_SECONDS:-3600}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      AUTH_SERVICE_ACCOUNT_ID: ${AUTH_SERVICE_ACCOUNT_ID:-0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_REALTIME_URL: ${VOICE_REALTIME_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      VOICE_REALTIME_PROXY: ${VOICE_REALTIME_PROXY:-}
      VOICE_REALTIME_STT_MODEL: ${VOICE_REALTIME_STT_MODEL:-qwen3-asr-flash-realtime}
      VOICE_REALTIME_TTS_MODEL: ${VOICE_REALTIME_TTS_MODEL:-qwen3-tts-flash-realtime}
      VOICE_REALTIME_VOICES: '${VOICE_REALTIME_VOICES:-["Cherry"]}'
      VOICE_MAX_SESSIONS: ${VOICE_MAX_SESSIONS:-8}
      VOICE_SESSION_SECONDS: ${VOICE_SESSION_SECONDS:-1800}
      VOICE_IDLE_SECONDS: ${VOICE_IDLE_SECONDS:-120}
      VOICE_QUEUE_SIZE: ${VOICE_QUEUE_SIZE:-64}
      VOICE_VAD_SILENCE_MS: ${VOICE_VAD_SILENCE_MS:-500}
      VOICE_VAD_THRESHOLD: ${VOICE_VAD_THRESHOLD:-0.2}
      DATABASE_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-acmetech-employee-handbook}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      NACOS_ENABLED: ${NACOS_ENABLED:-false}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-host.docker.internal:8848}
      NACOS_CONTEXT_PATH: ${NACOS_CONTEXT_PATH:-/nacos}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      NACOS_NAMESPACE_ID: ${NACOS_NAMESPACE_ID:-}
      NACOS_GROUP_NAME: ${NACOS_GROUP_NAME:-DEFAULT_GROUP}
      NACOS_CONFIG_DATA_ID: ${NACOS_CONFIG_DATA_ID:-}
      NACOS_STORAGE_CONFIG_REQUIRED: ${NACOS_STORAGE_CONFIG_REQUIRED:-true}
      NACOS_REGISTER_SERVICE: ${NACOS_REGISTER_SERVICE:-true}
      NACOS_SERVICE_NAME: ${NACOS_SERVICE_NAME:-agent-service-toolkit}
      NACOS_SERVICE_IP: ${NACOS_SERVICE_IP:-}
      NACOS_SERVICE_PORT: ${NACOS_SERVICE_PORT:-}
      NACOS_CLUSTER_NAME: ${NACOS_CLUSTER_NAME:-DEFAULT}
      NACOS_METADATA: '${NACOS_METADATA:-{}}'
      NACOS_GRPC_PORT_OFFSET: ${NACOS_GRPC_PORT_OFFSET:-1000}
      NACOS_CACHE_DIR: ${NACOS_CACHE_DIR:-/tmp/agent-service-toolkit/nacos/cache}
      NACOS_LOG_DIR: ${NACOS_LOG_DIR:-/tmp/agent-service-toolkit/nacos/logs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Volume mount of development-only credentials since compose watch doesn't sync ignored files and doesn't do initial sync when the service starts
    volumes:
      - ./privatecredentials:/privatecredentials
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/agents/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/service/
          action: sync+restart
          target: /app/service/
        - path: src/core/
          action: sync+restart
          target: /app/core/
        - path: src/memory/
          action: sync+restart
          target: /app/memory/
        - path: src/voice/
          action: sync+restart
          target: /app/voice/
        - path: src/rag/
          action: sync+restart
          target: /app/rag/
  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      - agent_service
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      AGENT_URL: http://agent_service:8080
      AUTH_SECRET: ${AUTH_SECRET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_NATIVE_BASE_URL: ${DASHSCOPE_NATIVE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/client/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py
        - path: src/voice/
          action: sync+restart
          target: /app/voice/

volumes:
  postgres_data:
  redis_data:

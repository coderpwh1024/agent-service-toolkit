services:
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "${AGENT_HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
      - path: config/environments/${APP_ENV:-local}.env
        required: true
      - path: .env.${APP_ENV:-local}
        required: false
      - path: config/environments/${APP_ENV:-local}.compose.env
        required: true
    environment:
      # Prefer values inherited by `docker compose` from the host shell. Compose
      # also uses a project .env file for interpolation when one is present.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_TOKEN_TTL_SECONDS: ${APP_TOKEN_TTL_SECONDS:-3600}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      AUTH_SERVICE_ACCOUNT_ID: ${AUTH_SERVICE_ACCOUNT_ID:-0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_REALTIME_URL: ${VOICE_REALTIME_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      VOICE_REALTIME_PROXY: ${VOICE_REALTIME_PROXY:-}
      VOICE_REALTIME_STT_MODEL: ${VOICE_REALTIME_STT_MODEL:-qwen3-asr-flash-realtime}
      VOICE_REALTIME_TTS_MODEL: ${VOICE_REALTIME_TTS_MODEL:-qwen3-tts-flash-realtime}
      VOICE_MAX_SESSIONS: ${VOICE_MAX_SESSIONS:-8}
      VOICE_SESSION_SECONDS: ${VOICE_SESSION_SECONDS:-1800}
      VOICE_IDLE_SECONDS: ${VOICE_IDLE_SECONDS:-120}
      VOICE_QUEUE_SIZE: ${VOICE_QUEUE_SIZE:-64}
      VOICE_VAD_SILENCE_MS: ${VOICE_VAD_SILENCE_MS:-500}
      VOICE_VAD_THRESHOLD: ${VOICE_VAD_THRESHOLD:-0.2}
      DATABASE_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-acmetech-employee-handbook}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Volume mount of development-only credentials since compose watch doesn't sync ignored files and doesn't do initial sync when the service starts
    volumes:
      - ./privatecredentials:/privatecredentials
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/agents/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/service/
          action: sync+restart
          target: /app/service/
        - path: src/core/
          action: sync+restart
          target: /app/core/
        - path: src/memory/
          action: sync+restart
          target: /app/memory/
        - path: src/voice/
          action: sync+restart
          target: /app/voice/
        - path: src/rag/
          action: sync+restart
          target: /app/rag/
  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      - agent_service
    env_file:
      - path: .env
        required: false
      - path: config/environments/${APP_ENV:-local}.env
        required: true
      - path: .env.${APP_ENV:-local}
        required: false
      - path: config/environments/${APP_ENV:-local}.compose.env
        required: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      AGENT_URL: http://agent_service:8080
      AUTH_SECRET: ${AUTH_SECRET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_NATIVE_BASE_URL: ${DASHSCOPE_NATIVE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/client/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py
        - path: src/voice/
          action: sync+restart
          target: /app/voice/

volumes:
  postgres_data:
  redis_data:
